[package]
name = "loom_mcp"
description = "MCP adapter: serves the `loom serve` methods as MCP tools over stdio."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "loom-mcp"
path = "src/main.rs"

# Talks to the engine only through a `loom serve` child process: no engine
# crate here (docs/architecture.md sections 1 and 13).
[dependencies]
rmcp.workspace = true
tokio.workspace = true
base64.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
clap.workspace = true
log.workspace = true
env_logger.workspace = true

[lints]
workspace = true
