[workspace]
resolver = "3"
members = ["crates/*", "games/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = ""
publish = false

[workspace.dependencies]
# internal
loom_core = { path = "crates/loom_core" }
loom_platform = { path = "crates/loom_platform" }
loom_render = { path = "crates/loom_render" }
loom_scene = { path = "crates/loom_scene" }
rogue = { path = "games/rogue" }
souls = { path = "games/souls" }

# windowing / graphics
winit = "0.30.13"
wgpu = "30.0.1"
pollster = "1.0.1"
bytemuck = { version = "1.25.2", features = ["derive"] }

# math
glam = { version = "0.33.10", features = ["bytemuck", "serde", "libm"] }
libm = "0.2.16"

# io / data
image = { version = "0.25.10", default-features = false, features = ["png"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
ron = "0.12.2"
# glTF 2.0 models (docs/architecture.md section 19): parsing and accessor
# reading only ("utils"), with names for `loom model`; no image decoding or
# external file loading ("import")
gltf = { version = "1.4.1", default-features = false, features = ["utils", "names"] }
# JSON Schema of the file and state formats (`loom schema`); the same major
# version rmcp uses
schemars = "1.2.2"
# dev only: checks data against those schemas
jsonschema = { version = "0.58.1", default-features = false }

# cli / errors / logging
clap = { version = "4.6.7", features = ["derive"] }
anyhow = "1.0.104"
thiserror = "2.0.21"
log = "0.4.34"
env_logger = "0.11.11"

# MCP adapter only (crates/loom_mcp); the engine crates never use these
rmcp = { version = "3.4.1", features = ["server", "macros", "transport-io"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "process", "sync", "time"] }
base64 = "0.23.1"

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
print_stdout = "warn"
print_stderr = "warn"
unwrap_used = "warn"

# Game code is unplayable at opt-level 0; dependencies (wgpu, image) are
# optimized even in dev builds, our own crates stay fast to compile.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
