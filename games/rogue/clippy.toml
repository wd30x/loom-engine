allow-unwrap-in-tests = true
allow-print-in-tests = true

# A crate-level clippy.toml replaces the workspace one, so the two settings
# above are copied from it. Simulation state must be bit-identical on every
# machine; std's transcendental functions call the platform's math library,
# whose results may differ in the last bit (docs/architecture.md section 4).
disallowed-methods = [
    { path = "f32::sin", reason = "use libm, see docs/architecture.md section 4" },
    { path = "f32::cos", reason = "use libm, see docs/architecture.md section 4" },
    { path = "f32::tan", reason = "use libm, see docs/architecture.md section 4" },
    { path = "f32::sin_cos", reason = "use libm, see docs/architecture.md section 4" },
    { path = "f32::asin", reason = "use libm, see docs/architecture.md section 4" },
    { path = "f32::acos", reason = "use libm, see docs/architecture.md section 4" },
    { path = "f32::atan", reason = "use libm, see docs/architecture.md section 4" },
    { path = "f32::atan2", reason = "use libm, see docs/architecture.md section 4" },
    { path = "f32::sinh", reason = "use libm, see docs/architecture.md section 4" },
    { path = "f32::cosh", reason = "use libm, see docs/architecture.md section 4" },
    { path = "f32::tanh", reason = "use libm, see docs/architecture.md section 4" },
